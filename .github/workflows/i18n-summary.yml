name: Translation summary

on:
  push:
    branches: [main]
    paths:
      - ".phrasey/**"
      - "i18n/**"
      - "cli/i18n/**"
  pull_request:
    paths:
      - ".phrasey/**"
      - "i18n/**"
      - "cli/i18n/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  summary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install translation tooling
        run: npm ci
      - name: Generate translation summary
        run: npm run i18n:summary
      - name: Upload summary
        uses: actions/upload-artifact@v7
        with:
          name: translation-summary
          path: phrasey-dist
          if-no-files-found: error
